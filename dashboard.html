
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind+Guntur:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <title>My Dashboard | Sachivalayam CMS</title>
</head>

<body>

    <header id="nav"></header>

    <main>

        <!-- Dashboard heading -->
        <h1 data-i18n="dash">My Dashboard</h1>

        <!-- Home button -->
        <p>
            <a class="btn" href="home.html">⌂ Home</a>
        </p>

        <!-- User information -->
        <div class="card">
            <b id="who"></b>
            <br>
            <span class="mut" id="mail"></span>
        </div>

        <!-- Latest complaint update -->
        <div class="card" id="note" role="status">
            No updates yet.
        </div>

        <!-- Complaint statistics -->
        <div class="stats" style="margin-top:0">

            <div class="stat">
                <b id="t">0</b>
                <span data-i18n="tot">Total complaints</span>
            </div>

            <div class="stat">
                <b id="a">0</b>
                <span data-i18n="act">Active</span>
            </div>

            <div class="stat">
                <b id="r">0</b>
                <span data-i18n="res">Resolved</span>
            </div>

        </div>

        <!-- Register complaint -->
        <p>
            <a class="btn" href="complaint.html" data-i18n="reg">
                Register complaint
            </a>
        </p>

        <!-- Complaint list -->
        <h2>My Complaints</h2>

        <div id="list">
            <p>Loading your complaints...</p>
        </div>

    </main>

    <footer>
        © 2026 Sachivalayam Complaint Management System
    </footer>

    <script type="module">

        import {
            guard,
            db,
            F,
            $,
            card,
            stName,
            byNew
        } from "./js/app.js";

        // Verify that the user is logged in.
        const u = await guard();

        // Display user information.
        $("#who").textContent = u.displayName || "User";
        $("#mail").textContent = u.email || "";

        // Listen for the current user's complaints.
        const complaintsQuery = F.query(
            F.collection(db, "complaints"),
            F.where("uid", "==", u.uid)
        );

        F.onSnapshot(
            complaintsQuery,

            snapshot => {

                const complaints = snapshot.docs
                    .map(doc => ({
                        ...doc.data(),
                        documentId: doc.id
                    }))
                    .sort(byNew);

                // Calculate statistics.
                const total = complaints.length;

                const resolved = complaints.filter(
                    complaint => complaint.status === "Resolved"
                ).length;

                const active = total - resolved;

                $("#t").textContent = total;
                $("#a").textContent = active;
                $("#r").textContent = resolved;

                // Find the latest complaint update.
                const latestUpdate = complaints
                    .filter(
                        complaint =>
                            complaint.status !== "Submitted"
                    )
                    .sort(
                        (a, b) =>
                            (b.updatedAt?.seconds || 0) -
                            (a.updatedAt?.seconds || 0)
                    )[0];

                if (latestUpdate) {

                    $("#note").textContent =
                        latestUpdate.id +
                        ": " +
                        stName(latestUpdate.status);

                } else if (total > 0) {

                    $("#note").textContent =
                        "Your complaints have been submitted. Updates will appear here.";

                } else {

                    $("#note").textContent =
                        "You have not filed a complaint yet.";

                }

                // Render complaints.
                $("#list").innerHTML = complaints
                    .map(complaint => card(complaint))
                    .join("") ||
                    "<p>You have not filed a complaint yet.</p>";

            },

            error => {

                console.error(
                    "Dashboard complaint loading error:",
                    error
                );

                $("#list").textContent =
                    "Unable to load complaints. Please refresh the page.";

                $("#note").textContent =
                    "There was a problem loading your complaint updates.";

            }
        );

    </script>

</body>
</html>
