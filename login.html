<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hind+Guntur:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Login | Sachivalayam CMS</title>
</head>

<body>

    <header id="nav"></header>

    <main class="narrow">

        <h1>Login</h1>

        <form id="f">

            <label for="e">Email</label>

            <input
                id="e"
                type="email"
                required
                autocomplete="email"
            >

            <label for="p">Password</label>

            <input
                id="p"
                type="password"
                required
                autocomplete="current-password"
            >

            <p>
                <button class="btn" id="loginBtn" type="submit">
                    Login
                </button>
            </p>

            <a href="#" id="fp">Forgot password?</a>

            &nbsp;

            <a href="register.html">Create an account</a>

        </form>

    </main>

    <script type="module">

        import {
            boot,
            auth,
            A,
            R,
            rtdb,
            $,
            toast,
            authErr
        } from "./js/app.js";

        // Initialize navigation.
        boot().catch(error => {
            console.error("Navigation initialization failed:", error);
        });

        const form = $("#f");
        const emailInput = $("#e");
        const passwordInput = $("#p");
        const loginButton = $("#loginBtn");

        // LOGIN
        form.addEventListener("submit", async event => {

            event.preventDefault();

            if (loginButton.disabled) {
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {

                // Step 1: Authenticate user.
                const credential =
                    await A.signInWithEmailAndPassword(
                        auth,
                        emailInput.value.trim(),
                        passwordInput.value
                    );

                const user = credential.user;

                console.log(
                    "Authentication successful. UID:",
                    user.uid
                );

                // Step 2: Check admin status in Realtime Database.
                let admin = false;

                try {

                    const adminSnapshot = await R.get(
                        R.ref(rtdb, "admins/" + user.uid)
                    );

                    admin = adminSnapshot.val() === true;

                    console.log("Admin status:", admin);

                } catch (databaseError) {

                    console.error(
                        "ADMIN DATABASE CHECK FAILED:",
                        databaseError
                    );

                    console.error(
                        "DATABASE ERROR CODE:",
                        databaseError.code
                    );

                    // Do not grant admin access when verification fails.
                    toast(
                        "Login succeeded, but admin verification failed: " +
                        (databaseError.code || databaseError.message)
                    );

                    return;
                }

                // Step 3: Redirect to the requested page, if valid.
                const requestedPage =
                    new URLSearchParams(location.search).get("next");

                // Allow only simple HTML filenames, not external URLs.
                const safeNext =
                    requestedPage &&
                    /^[\w-]+\.html$/.test(requestedPage);

                if (safeNext) {

                    // Prevent non-admin users from opening admin.html
                    // through the next parameter.
                    if (
                        requestedPage === "admin.html" &&
                        !admin
                    ) {
                        location.href = "dashboard.html";
                        return;
                    }

                    location.href = requestedPage;

                } else {

                    location.href =
                        admin ? "admin.html" : "dashboard.html";

                }

            } catch (error) {

                console.error("LOGIN ERROR DETAILS:", error);

                console.error("ERROR CODE:", error.code);

                console.error("ERROR MESSAGE:", error.message);

                toast(
                    (error.code || "unknown-error") +
                    ": " +
                    authErr(error)
                );

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });

        // FORGOT PASSWORD
        $("#fp").addEventListener("click", async event => {

            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                toast("Enter your email first.");
                return;
            }

            try {

                await A.sendPasswordResetEmail(auth, email);

                toast(
                    "Password reset link sent to your email."
                );

            } catch (error) {

                console.error(
                    "PASSWORD RESET ERROR:",
                    error
                );

                toast(authErr(error));

            }

        });

    </script>

</body>
</html>
